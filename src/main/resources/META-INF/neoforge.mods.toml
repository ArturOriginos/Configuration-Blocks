[[mods]]
modId = "configurationblocks"
version = "1.4.1"
displayName = "Configuration Blocks"
description = '''
Adds the Configurator - a paper that lets you change almost any property of a placed block:
hardness, blast resistance, gravity, light, redstone power, bounciness and block functions
(chest, furnace, crafting table, jukebox and more).
'''

[[mixins]]
config = "configurationblocks.mixins.json"

